name: Test CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-24.04
    steps:
      - name: Dire bonjour
        run: echo "Hello GithubActions"

      - name: Afficher des infos sur le contexte
        env:
          DEPOT: ${{ github.repository }}
          BRANCHE: ${{ github.ref_name }}
          AUTEUR: ${{ github.actor }}
        run: |
          echo "Dépôt: $DEPOT"
          echo "Branche: $BRANCHE"
          echo "Auteur du commit: $AUTEUR"
